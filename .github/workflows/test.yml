name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.1', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      # The kagome binaries are not committed; build them from the Go module.
      # On ubuntu-latest (x86_64) this produces kagome-linux-amd64, which
      # Analyzer::detectBinaryPath() selects and the PHPUnit suite executes.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build kagome binaries
        run: bash bin/build.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: plugins/wp-kagome-analyzer
        run: composer install --no-progress

      - name: PHPUnit
        working-directory: plugins/wp-kagome-analyzer
        run: composer test

  status:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [ phpunit ]
    if: always()
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
